<section id="page-updates" class="page" hidden aria-labelledby="updates-title">
  <div class="page-head"><div><h1 id="updates-title">领域观察与目标影响<span class="heading-dot">.</span></h1><p>主动保存两次观察，再核对原文、样本和分析口径的变化。资料不足时保持未知。</p></div><button id="refresh-updates" class="secondary">刷新观察</button></div>
  <form id="update-capture" class="panel strategy-editor"><h2>保存当前观察面板</h2><div class="form-grid"><label>面板名称<input name="title" required maxlength="150" placeholder="例如：本周应用开发观察"></label><label>领域定义版本<select name="domain_id" id="update-domain"><option value="">全部岗位，分类未知仍保留</option></select></label><label>字面统计词（逗号分隔，最多10个）<input name="terms" placeholder="Python, RAG, 记忆"></label></div><label class="checkbox-line"><input name="use_selected" type="checkbox">只保存岗位页已勾选的资料（否则使用当前筛选的完整范围）</label><label class="checkbox-line"><input name="include_personal" type="checkbox">解释已明确保存的个人条件/偏好</label><p class="form-note">不会采集新资料或调用模型；保留正文版本和完整分母。文本偏好不自动变成硬性条件，未知画像/关系不当作没有要求。</p><button class="primary">冻结当前观察</button></form>
  <form id="update-compare" class="panel strategy-editor"><h2>比较两个已冻结面板</h2><div class="form-grid"><label>较早面板<select name="before_id" id="update-before" required></select></label><label>较晚面板<select name="after_id" id="update-after" required></select></label></div><button class="secondary">生成变化核对报告</button><p class="form-note">样本增删不表示招聘开启或关闭；两次观察不证明市场趋势。</p></form>
  <div id="updates-list" class="reports-list"></div><div id="update-report"></div>
</section>
